services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rct
      POSTGRES_PASSWORD: rct_dev_password
      POSTGRES_DB: rct
    ports:
      - "5432:5432"
    volumes:
      - rct_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct -d rct"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rct_pg:
